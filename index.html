<script>

function A(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state=='suspended')ac.resume();return ac}
function tone(f,d,type,v,f2,t0){if(mute)return;const a=A();if(!a)return;const t=a.currentTime+(t0||0),o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const S={w(){wk^=1;tone(wk?320:450,.07,'square',.05)},p(){tone(110,.35,'sawtooth',.07,700)},i(){[660,880,1320].forEach((f,i)=>tone(f,.1,'square',.06,0,i*.07))},g(){tone(180,.3,'square',.07,1200)},
l(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.13,'square',.06,0,i*.11))},d(){tone(800,.8,'sawtooth',.07,50)},s(){[392,523,659,784].forEach((f,i)=>tone(f,.12,'square',.06,0,i*.12))},j(){tone(900,.1,'square',.05)}};
function ev(k,s){if(net=='host')evs.push([k,s]);playEv(k,s)}
function playEv(k,s){if(k=='w'&&s!=me)return;if(S[k])S[k]()}
// ---------- Gerador de labirintos originais (simétricos, conexos) ----------
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function mk(r){const g=Array.from({length:R},()=>Array(C).fill('#')),seen=new Set([0]),st=[[0,0]];g[1][1]='.';
const op=(a,b,nx,ny)=>{g[ny*2+1][nx*2+1]='.';g[b+ny+1][a+nx+1]='.'};
while(st.length){const[a,b]=st[st.length-1],nb=[];for(let d=0;d<4;d++){const nx=a+DX[d],ny=b+DY[d];if(nx<0||nx>4||ny<0||ny>9||seen.has(ny*5+nx))continue;nb.push([nx,ny])}
if(!nb.length){st.pop();continue}const[nx,ny]=nb[Math.floor(r()*nb.length)];seen.add(ny*5+nx);op(a,b,nx,ny);st.push([nx,ny])}
for(let b=0;b<10;b++)for(let a=0;a<5;a++){let n=0;const cl=[];for(let d=0;d<4;d++){const nx=a+DX[d],ny=b+DY[d];if(nx<0||nx>4||ny<0||ny>9)continue;if(g[b+ny+1][a+nx+1]=='.')n++;else cl.push([nx,ny])}
if(cl.length&&((n<2&&r()<.8)||r()<.1)){const[nx,ny]=cl[Math.floor(r()*cl.length)];op(a,b,nx,ny)}}
for(let y=0;y<R;y++)for(let x=0;x<9;x++)g[y][C-1-x]=g[y][x];
for(let y=7;y<=11;y++)for(let x=6;x<=12;x++)g[y][x]=' ';
for(let x=7;x<=11;x++){g[8][x]='#';g[10][x]='#'}g[8][9]='-';g[9][7]='#';g[9][11]='#';g[9][0]=g[9][C-1]=' ';
for(const[x,y]of SP)g[y][x]=' ';for(const[x,y]of[[1,1],[17,1],[1,19],[17,19]])g[y][x]='o';return g}
function conn(g){const sn=new Set([15*C+9]),q=[[9,15]];while(q.length){const[x,y]=q.pop();for(let d=0;d<4;d++){const nx=(x+DX[d]+C)%C,ny=y+DY[d];if(ny<0||ny>=R)continue;const c=g[ny][nx];if(c=='#'||c=='-'||sn.has(ny*C+nx))continue;sn.add(ny*C+nx);q.push([nx,ny])}}

function gen(n){let g;for(let a=0;a<60;a++){g=mk(rng(seed+n*7919+a*131));if(conn(g))return g}return g}
function mkMaze(col){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.strokeStyle=col;x.lineWidth=2;x.lineCap='round';x.beginPath();
for(let y=0;y<R;y++)for(let i=0;i<C;i++){const px=i*T,py=y*T,ch=grid[y][i];if(ch=='-'){x.fillStyle='#8a5cff';x.fillRect(px,py+6,T,3);continue}if(ch!='#')continue;x.fillStyle='#0b1240';x.fillRect(px,py,T,T);
for(let d=0;d<4;d++){const ny=y+DY[d],nx=i+DX[d];if(ny<0||ny>=R||nx<0||nx>=C||grid[ny][nx]=='#')continue;
if(d==0){x.moveTo(px+T-1,py);x.lineTo(px+T-1,py+T)}else if(d==1){x.moveTo(px,py+T-1);x.lineTo(px+T,py+T-1)}else if(d==2){x.moveTo(px+1,py);x.lineTo(px+1,py+T)}else{x.moveTo(px,py+1);x.lineTo(px+T,py+1)}}}
x.stroke();return c}
function mkDM(){dm=Array.from({length:R},()=>Array(C).fill(1e9));dm[9][9]=0;const q=[[9,9]];while(q.length){const[x,y]=q.shift();for(let d=0;d<4;d++){const nx=(x+DX[d]+C)%C,ny=y+DY[d];if(!ok(nx,ny,true)||dm[ny][nx]<1e9)continue;dm[ny][nx]=dm[y][x]+1;q.push([nx,ny])}}}
function gridStr(){return grid.map(r=>r.join('')).join('')}
function setGrid(g,n){grid=g;G.lv=n;total=0;for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(grid[y][x]=='.'||grid[y][x]=='o')total++;

// ---------- Simulação (solo e anfitrião) ----------
function initP(n){P=Array.from({length:6},(_,i)=>({i,on:i<n?1:0,x:SP[i][0]*T,y:SP[i][1]*T,d:2,nd:2,acc:0,mv:0,al:1,inv:0,rt:0,sc:0,lv:3,dx:SP[i][0]*T,dy:SP[i][1]*T}))}
function spawnP(p){p.x=SP[p.i][0]*T;p.y=SP[p.i][1]*T;p.d=p.nd=2;p.acc=0;p.mv=0;p.al=1;p.inv=120}
function startLevel(n,quiet){const g=gen(n);setGrid(g,n);eaten=0;spawned=0;item=null;pops=[];er=[];
const np=P.filter(p=>p.on).length,ng=3+Math.ceil(np/2),k=Math.max(.4,1-.1*n);
gh=Array.from({length:ng},(_,i)=>({c:EC[i%4],i,x:(i?[9,8,10][i%3]:9)*T,y:(i?9:7)*T,d:i?3:2,mode:i?'house':'norm',rel:Math.round(i*90*k),acc:0,door:false,fr:0}));
P.forEach(p=>{if(p.on){if(p.lv<1)p.lv=1;spawnP(p)}});gmI=0;gmT=0;gm=0;freeze=0;mult=0;combo=0;state='ready';sT=150;
if(!quiet){ev('s',-1);if(net=='host')post({t:'L',n,g:gridStr()})}hud()}
const PS=()=>Math.min(1.05,.95+G.lv*.01),gs=g=>g.mode=='eaten'?2:g.fr>0?.5:Math.min(.97,.72+.03*G.lv);
function add(p,n){p.sc+=n*(mult>0?2:1);if(p.i==me&&p.sc>hi){hi=p.sc;LS.set('sl_hi',hi)}}
function pop(x,y,s){pops.push({x,y,t:50,s:''+s})}
function power(){combo=0;ev('p',-1);gh.forEach(g=>{if(g.mode=='norm'||g.mode=='leave'){g.fr=Math.max(180,600-G.lv*50);if(g.mode=='norm')g.d=(g.d+2)%4}})}
function takeItem(p){const i=item.it;add(p,i.p);pop(item.tx*T,item.ty*T,i.p);ev('i',-1);if(i.fx=='star')freeze=300;if(i.fx=='dia')mult=600;if(i.fx=='life')p.lv=Math.min(5,p.lv+1);item=null}
function stepP(p){
if(p.x%T==0&&p.y%T==0){const tx=p.x/T,ty=p.y/T,ch=grid[ty][tx];
if(ch=='.'||ch=='o'){grid[ty][tx]=' ';er.push(ty*C+tx);eaten++;add(p,ch=='.'?10:50);if(ch=='.')ev('w',p.i);else power();
if(eaten>=total){state='clear';sT=150;ev('l',-1);return}
if(spawned<2&&eaten>=total*(spawned?.65:.3)){const k=LV[(G.lv-1)%4][spawned];item={tx:9,ty:11,k,it:ITEMS[k],t:660};spawned++}}
if(item&&item.tx==tx&&item.ty==ty)takeItem(p);
if(ok(tx+DX[p.nd],ty+DY[p.nd]))p.d=p.nd;
if(!ok(tx+DX[p.d],ty+DY[p.d])){p.mv=0;return}
}else if(p.nd==(p.d+2)%4)p.d=p.nd;
p.mv=1;p.x=(p.x+DX[p.d]+W)%W;p.y+=DY[p.d]}
function nearest(g){let b=null,bd=1e9;for(const p of P){if(!p.on||!p.al)continue;const d=(p.x-g.x)**2+(p.y-g.y)**2;if(d<bd){bd=d;b=p}}return b||P[0]}
function target(g){if(g.mode=='leave')return[9,7];if(gm==0)return SC[g.i%4];
const p=nearest(g),px=Math.round(p.x/T),py=Math.round(p.y/T),dx=DX[p.d],dy=DY[p.d],k=g.i%4;
if(k==0)return[px,py];if(k==1)return[px+4*dx,py+4*dy];

function choose(g){const tx=g.x/T,ty=g.y/T,rev=(g.d+2)%4;let best=-1,bd=1e9;
if(g.mode=='eaten'){for(let d=0;d<4;d++){const nx=(tx+DX[d]+C)%C,ny=ty+DY[d];if(!ok(nx,ny,true))continue;if(dm[ny][nx]<bd){bd=dm[ny][nx];best=d}}}
else if(g.fr>0&&g.mode=='norm'){const o=[];for(let d=0;d<4;d++)if(d!=rev&&ok(tx+DX[d],ty+DY[d],false))o.push(d);if(o.length)best=o[Math.floor(Math.random()*o.length)]}
else{const[gx,gy]=target(g);for(const d of[3,2,1,0]){if(d==rev||!ok(tx+DX[d],ty+DY[d],g.door))continue;const nx=(tx+DX[d]+C)%C,ny=ty+DY[d],v=(nx-gx)**2+(ny-gy)**2;if(v<bd){bd=v;best=d}}}

function stepG(g){if(g.x%T==0&&g.y%T==0){const tx=g.x/T,ty=g.y/T;
if(g.mode=='leave'&&tx==9&&ty==7){g.mode='norm';g.door=false}
if(g.mode=='eaten'&&tx==9&&ty==9){g.mode='leave';g.door=true;g.d=3;g.fr=0}choose(g)}
g.x=(g.x+DX[g.d]+W)%W;g.y+=DY[g.d]}
function hit(){for(const g of gh){if(g.mode=='house'||g.mode=='eaten')continue;for(const p of P){if(!p.on||!p.al)continue;

function play(){

if(++gmT>=SCH[gmI]){gmT=0;gmI++;gm=gmI&1;gh.forEach(g=>{if(g.mode=='norm'&&!g.fr)g.d=(g.d+2)%4})}
if(item&&--item.t<=0)item=null;pops.forEach(p=>{p.t--;p.y-=.3});pops=pops.filter(p=>p.t>0);

// ---------- Rede (servidor local /ev + /m) ----------
let mode='srv',peers={},hostCh=null,gpc=null,pend=null;
function post(m){if(mode=='srv')fetch('/m?r='+room+'&c='+cid,{method:'POST',body:JSON.stringify(m)}).catch(()=>{});
else{const t=JSON.stringify(m);if(net=='host'){for(const k in peers)if(peers[k].open)peers[k].ch.send(t)}else if(hostCh&&hostCh.readyState=='open')hostCh.send(t)}}
function connect(isHost,code){return new Promise((res,rej)=>{room=code;let up=false;es=new EventSource('/ev?r='+code+'&c='+cid+(isHost?'&h=1':''));

else if(m.t=='i'){const p=P[slotOf[m.f]];if(p)p.nd=m.d}
else if(m.t=='p')post({t:'q',to:m.f,ts:m.ts})

else if(net=='guest'){

function apply(s){if(!grid)return;state=s.st;sT=s.sT;freeze=s.fz;mult=s.mu;G.lv=s.L;
